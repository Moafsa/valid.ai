<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Burger menu</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#1a1a2e;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header.top{background:#101828;color:#fff}header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:22px}
h1{font-size:44px;line-height:1.1;margin:0 0 12px}h2{font-size:30px;margin:0 0 16px}p{margin:0 0 12px}
.btn{display:inline-block;background:#2563eb;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600}
section.blk{padding:56px 0}section.alt{background:#f3f4f6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px}
img{max-width:100%;height:auto;display:block}
footer.ft{background:#0b1220;color:#9ca3af;padding:32px 0;font-size:14px}
.nav a{color:#fff;margin-left:20px;text-decoration:none}.burger{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
@media(max-width:768px){.burger{display:block}.nav{display:none;position:absolute;top:64px;left:0;right:0;background:#1f2937;padding:12px 24px;z-index:5}.nav.open{display:block}.nav a{display:block;margin:0;padding:10px 0}}header.top{position:relative}</style></head><body><header class="top"><div class="wrap"><div class="logo">Brand</div><button class="burger" aria-label="Open menu" id="bg">&#9776;</button><nav class="nav" id="nv"><a href="#a">Products</a><a href="#b">Solutions</a><a href="#c">Pricing</a><a href="#d">Contact</a></nav></div></header><section class="blk"><div class="wrap"><h1>Menu test</h1><p>Open the menu on small screens.</p></div></section><script>document.getElementById('bg').addEventListener('click',function(){document.getElementById('nv').classList.toggle('open')})</script></body></html>
