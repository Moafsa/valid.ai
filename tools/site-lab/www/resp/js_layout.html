<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Script-computed layout</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#1a1a2e;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header.top{background:#101828;color:#fff}header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:22px}
h1{font-size:44px;line-height:1.1;margin:0 0 12px}h2{font-size:30px;margin:0 0 16px}p{margin:0 0 12px}
.btn{display:inline-block;background:#2563eb;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600}
section.blk{padding:56px 0}section.alt{background:#f3f4f6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px}
img{max-width:100%;height:auto;display:block}
footer.ft{background:#0b1220;color:#9ca3af;padding:32px 0;font-size:14px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row .card{flex:none}</style></head><body><header class="top"><div class="wrap"><div class="logo">Brand</div></div></header><section class="blk"><div class="wrap"><h2>Equal cards</h2><div class="row" id="row"><div class="card"><h3>A</h3><p>Short text.</p></div><div class="card"><h3>B</h3><p>A lot more text in this card so that heights differ between the cards in the row.</p></div><div class="card"><h3>C</h3><p>Medium amount of text.</p></div></div></div></section><script>function lay(){var row=document.getElementById('row');var n=innerWidth>=900?3:innerWidth>=600?2:1;var w=(row.clientWidth-16*(n-1))/n;var cs=[].slice.call(row.children);cs.forEach(function(c){c.style.width=w+'px';c.style.height='auto'});var mx=0;cs.forEach(function(c){mx=Math.max(mx,c.offsetHeight)});if(n>1)cs.forEach(function(c){c.style.height=mx+'px'})}lay();addEventListener('resize',lay)</script></body></html>
