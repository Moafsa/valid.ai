<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz longo</title>
<style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}#app{max-width:460px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:14px}
.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#2563eb;transition:width .5s}
button.o{padding:14px;border:1px solid #cbd5e1;background:#fff;border-radius:12px;font-size:16px;text-align:left;cursor:pointer}
button.o:hover{background:#eff6ff}.cta{background:#16a34a;color:#fff;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
h1{font-size:24px;margin:0}</style></head><body><div id="app"></div>
<script>
const N = parseInt(new URLSearchParams(location.search).get('n') || '60');
const app = document.getElementById('app');
function q(k){
  if (k > N) return end();
  const pct = Math.round(k / N * 100);
  app.innerHTML = `<div class="bar"><div style="width:${pct}%"></div></div><h1>Pergunta ${k} de ${N}</h1><p>Qual descreve melhor seu momento?</p>
   <button class="o" data-a="1">Opção A da pergunta ${k}</button><button class="o" data-a="2">Opção B da pergunta ${k}</button><button class="o" data-a="3">Opção C da pergunta ${k}</button>`;
  app.querySelectorAll('button.o').forEach(b => b.onclick = () => { fetch('/lead', {method:'POST', body: '{}'}).catch(()=>{}); if (k === 5 && b.dataset.a === '3') alt(); else q(k+1); });
}
function alt(){ app.innerHTML = `<div class="bar"><div style="width:100%"></div></div><h1>Final alternativo</h1><p>Esse caminho é diferente.</p><a class="cta" href="https://alternativo.example.com/obrigado">Falar no WhatsApp</a>`; }
function end(){ app.innerHTML = `<div class="bar"><div style="width:100%"></div></div><h1>Resultado pronto!</h1><p>Veja sua oferta.</p><button class="cta" id="buy">Quero minha oferta</button>`; document.getElementById('buy').onclick = () => { window.open('https://pay.example.com/checkout?name=' + encodeURIComponent('x'), '_blank'); }; }
q(1);
</script><div class="grecaptcha-badge" style="position:fixed;bottom:10px;right:10px;width:256px;height:60px"><iframe src="https://www.google.com/recaptcha/enterprise/anchor?k=1" width="256" height="60"></iframe></div><iframe id="MktoForms2XDIframe" src="about:blank" style="position:absolute;top:-100000px;width:1px;height:1px"></iframe></body></html>
