<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oferta vsl_lazy</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#fff;text-align:center}main{max-width:760px;margin:0 auto;padding:24px 16px}h1{font-size:28px}.cta{display:inline-block;margin:20px 8px;padding:16px 34px;background:#16a34a;color:#fff;border-radius:999px;font-weight:700;text-decoration:none}.box{position:relative;overflow:hidden;background:#000;border-radius:14px;margin:16px auto}.cover{position:absolute;inset:0;z-index:30;cursor:pointer;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}.cover i{width:70px;height:70px;border-radius:50%;background:#d32f2f;display:block}</style></head><body><main><h1>Assista ao vídeo até o final</h1><div style="height:1400px;color:#9ca3af;padding-top:40px">role para baixo</div>
<video id="lz" controls playsinline preload="none" style="width:640px;height:360px;background:#000"><source data-src="/media/vsl20.webm" type="video/webm"></video>
<div style="height:200px"></div></main><script>
const lz=document.getElementById('lz');
new IntersectionObserver((es,io)=>{es.forEach(e=>{if(e.isIntersecting){const s=lz.querySelector('source');s.src=s.dataset.src;lz.load();io.disconnect()}})},{rootMargin:'200px'}).observe(lz);</script></body></html>
