<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oferta vsl_ytcomp</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#fff;text-align:center}main{max-width:760px;margin:0 auto;padding:24px 16px}h1{font-size:28px}.cta{display:inline-block;margin:20px 8px;padding:16px 34px;background:#16a34a;color:#fff;border-radius:999px;font-weight:700;text-decoration:none}.box{position:relative;overflow:hidden;background:#000;border-radius:14px;margin:16px auto}.cover{position:absolute;inset:0;z-index:30;cursor:pointer;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}.cover i{width:70px;height:70px;border-radius:50%;background:#d32f2f;display:block}</style></head><body><main><h1>Assista ao vídeo até o final</h1><div class="box" style="width:360px;aspect-ratio:9/16"><youtube-video src="https://youtu.be/dQw4w9WgXcQ" style="display:block;width:100%;height:100%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.15)"></youtube-video><div id="cover" class="cover"><i></i></div></div><div id="slot" style="min-height:100px"></div></main><script>
class YT extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});this._t=0}
connectedCallback(){this.shadowRoot.innerHTML='<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=0&enablejsapi=1" style="width:100%;height:100%;border:0"></iframe>'}
get currentTime(){return this._t}get duration(){return 212}play(){clearInterval(this._i);this._i=setInterval(()=>{this._t+=1;this.dispatchEvent(new Event('timeupdate'))},1000)}}
customElements.define('youtube-video',YT);
const v=document.querySelector('youtube-video');
v.addEventListener('timeupdate',e=>{if(e.target.currentTime>=45&&!document.getElementById('buy')){const a=document.createElement('a');a.id='buy';a.href='https://pay.hotmart.com/x1';a.className='cta';a.textContent='ADICIONAR AO MEU PEDIDO';document.getElementById('slot').appendChild(a)}});
document.getElementById('cover').onclick=function(){this.remove();v.play()};</script></body></html>
